name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test with Compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://localhost:8080 > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080 > /dev/null
          curl -sf http://localhost:8081 > /dev/null
          docker compose down -v

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}:${{ github.sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan with Trivy
        run: trivy image --severity CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 ${{ env.IMAGE }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE }}